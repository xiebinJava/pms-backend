      contract is checked by SpringMvcSecurityApplicabilityIntegrationTest.
  - id: CVE-2026-47890
    paths:
      - app/pms-backend.jar
    purls:
      - pkg:maven/org.springframework/spring-webmvc@6.2.19
    expired_at: 2026-11-09
