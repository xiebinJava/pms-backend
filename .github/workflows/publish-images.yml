name: publish-backend-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish without a leading v
        required: true
        type: string
        default: 1.0.0
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match MAJOR.MINOR.PATCH: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing version tags
        shell: bash
        run: |
          set -euo pipefail
          for image in pms-backend pms-migrator; do
            ref="ghcr.io/${{ steps.version.outputs.owner }}/${image}:${{ steps.version.outputs.version }}"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "refusing to overwrite existing version tag: $ref" >&2
              exit 1
            fi
          done

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/pms-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/pms-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pms-backend
          cache-to: type=gha,mode=max,scope=pms-backend
          provenance: true
          sbom: true

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/pms-migrator:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/pms-migrator:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pms-migrator
          cache-to: type=gha,mode=max,scope=pms-migrator
          provenance: true
          sbom: true

      - name: Verify anonymous package access
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker manifest inspect \
            "ghcr.io/${{ steps.version.outputs.owner }}/pms-backend:${{ steps.version.outputs.version }}" \
            >/dev/null
          docker manifest inspect \
            "ghcr.io/${{ steps.version.outputs.owner }}/pms-migrator:${{ steps.version.outputs.version }}" \
            >/dev/null
          echo "backend and migrator manifests are anonymously readable"
