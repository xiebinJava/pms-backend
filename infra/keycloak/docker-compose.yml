services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-this-admin-password}
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8180}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-pms-dev.json:/opt/keycloak/data/import/pms-realm.json:ro

volumes:
  keycloak_data:
