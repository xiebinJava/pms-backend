<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1030" viewBox="0 0 1080 1030">
<rect width="1080" height="1030" rx="24" fill="#f6f8fc"/>
<rect x="0" y="0" width="1080" height="116" rx="24" fill="#132540"/>
<text x="42" y="51" font-size="28" font-weight="700" fill="#ffffff">DSH × PMS · 多智能体协同架构</text>
<text x="42" y="84" font-size="16" fill="#b8cce8">从市场组建团队，由项目助手统筹，业务结果回到 PMS</text>
<g font-family="sans-serif">
<text x="42" y="158" font-size="14" fill="#667c99">01  用户与工作台</text>
<rect x="220" y="137" width="640" height="95" rx="16" fill="#eaf1ff" stroke="#8eb2ed"/>
<text x="540" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#194a8b">用户 · DSH 对话工作台</text>
<text x="540" y="207" text-anchor="middle" font-size="16" fill="#516d92">提出目标 ｜ 查看进度 ｜ 处理人工决策</text>
<line x1="540" y1="233" x2="540" y2="274" stroke="#608bc8" stroke-width="2"/>
<polygon points="534,266 546,266 540,277" fill="#608bc8"/>
<text x="42" y="305" font-size="14" fill="#667c99">02  统一编排</text>
<rect x="220" y="278" width="640" height="104" rx="16" fill="#245cb2"/>
<text x="540" y="318" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">PMS 项目助手</text>
<text x="540" y="351" text-anchor="middle" font-size="16" fill="#e4eeff">拆解目标 · 挑选角色 · 分派任务 · 验收汇总 · 升级阻塞</text>
<text x="42" y="431" font-size="14" fill="#667c99">03  项目团队</text>
<polyline points="540,384 540,416 240,416 240,454" fill="none" stroke="#8ba5c9" stroke-width="2"/>
<polyline points="540,416 840,416 840,454" fill="none" stroke="#8ba5c9" stroke-width="2"/>
<line x1="540" y1="416" x2="540" y2="454" stroke="#8ba5c9" stroke-width="2"/>
<rect x="90" y="455" width="280" height="104" rx="15" fill="#f0ecfc"/><text x="230" y="496" text-anchor="middle" font-size="22" font-weight="700" fill="#7959af">产品经理 Agent</text><text x="230" y="530" text-anchor="middle" font-size="16" fill="#526781">需求与验收标准</text><rect x="390" y="455" width="280" height="104" rx="15" fill="#e7f5ef"/><text x="530" y="496" text-anchor="middle" font-size="22" font-weight="700" fill="#278365">开发 Agent</text><text x="530" y="530" text-anchor="middle" font-size="16" fill="#526781">代码与变更证据</text><rect x="690" y="455" width="280" height="104" rx="15" fill="#fff2e3"/><text x="830" y="496" text-anchor="middle" font-size="22" font-weight="700" fill="#a66c24">测试 Agent</text><text x="830" y="530" text-anchor="middle" font-size="16" fill="#526781">测试与缺陷报告</text>
<text x="540" y="594" text-anchor="middle" font-size="16" fill="#5c7493">分派向下 ↓  ｜  结果与阻塞向上 ↑  ｜  团队来自智能体广场</text>
<rect x="90" y="615" width="880" height="57" rx="12" fill="#ffffff" stroke="#d3deeb"/>
<text x="530" y="651" text-anchor="middle" font-size="17" fill="#45617f">每个角色独立绑定：身份提示词 + 工作规则 + Skill + 插件 + 版本</text>
<text x="42" y="724" font-size="14" fill="#667c99">04  受控能力</text>
<rect x="220" y="696" width="640" height="87" rx="14" fill="#edf2f8" stroke="#b9cada"/>
<text x="540" y="731" text-anchor="middle" font-size="22" font-weight="700" fill="#314e70">DSH 能力目录 → PMS 插件</text>
<text x="540" y="762" text-anchor="middle" font-size="16" fill="#526d88">查询数据 ｜ 预览变更 ｜ 确认执行 ｜ 回读结果</text>
<line x1="540" y1="784" x2="540" y2="825" stroke="#8ba5c9" stroke-width="2"/>
<polygon points="534,817 546,817 540,828" fill="#8ba5c9"/>
<text x="42" y="858" font-size="14" fill="#667c99">05  业务事实</text>
<rect x="220" y="828" width="640" height="90" rx="14" fill="#e6f3ef" stroke="#9ccbbb"/>
<text x="540" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#246c56">PMS API / 领域服务 → PMS 数据库</text>
<text x="540" y="896" text-anchor="middle" font-size="16" fill="#4d7568">业务规则、数据范围与最终权限由 PMS 校验</text>
<line x1="42" y1="947" x2="1038" y2="947" stroke="#d7e1ed"/>
<text x="42" y="979" font-size="15" fill="#667b95">汇报路径：专业 Agent → PMS 项目助手 → 用户（需要决策时）</text>
<text x="42" y="1006" font-size="15" fill="#667b95">角色运行于 DSH；PMS 保存业务事实。提示词与 Skill 不扩大用户权限。</text>
</g></svg>
