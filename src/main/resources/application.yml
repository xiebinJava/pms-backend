server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pms-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:pms;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      # Flyway owns schema initialization for every profile, including the
      # embedded H2 demo/test database.
      mode: never
      schema-locations: classpath:schema.sql
  flyway:
    enabled: true
    baseline-on-migrate: true
    # V1 mirrors the pre-Flyway schema.sql baseline. New enterprise tables
    # are introduced by V2 and later migrations.
    baseline-version: 1
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

pms:
  upload-dir: ${PMS_UPLOAD_DIR:./uploads}
  jwt:
    # 生产环境务必通过环境变量/配置文件覆盖
    secret: ${PMS_JWT_SECRET:pms-open-source-dev-secret-please-override-in-production-2026}
    expire-hours: 168
  auth:
    access-expire-minutes: ${PMS_ACCESS_EXPIRE_MINUTES:30}
    refresh-expire-days: ${PMS_REFRESH_EXPIRE_DAYS:30}
    max-failed-logins: ${PMS_MAX_FAILED_LOGINS:5}
    lock-minutes: ${PMS_LOCK_MINUTES:15}
