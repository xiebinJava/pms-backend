server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: pms-backend
  profiles:
    # All local and enterprise runtime runs use OceanBase.
    default: oceanbase
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  sql:
    init:
      # Flyway owns schema initialization for every profile.
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    # V1 mirrors the pre-Flyway schema.sql baseline. Enterprise tables are
    # introduced by V2 and later migrations.
    baseline-version: 1
    locations: classpath:db/migration
  # SMTP properties are only consumed when PMS_MAIL_ENABLED=true.
  mail:
    host: ${PMS_MAIL_HOST:}
    port: ${PMS_MAIL_PORT:587}
    username: ${PMS_MAIL_USERNAME:}
    password: ${PMS_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${PMS_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${PMS_MAIL_SMTP_STARTTLS:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

pms:
  upload-dir: ${PMS_UPLOAD_DIR:/var/lib/pms/uploads}
  upload:
    quota-bytes: ${PMS_UPLOAD_QUOTA_BYTES:524288000}
  jwt:
    # 生产环境务必通过环境变量/配置文件覆盖
    secret: ${PMS_JWT_SECRET:}
    expire-hours: 168
  auth:
    access-expire-minutes: ${PMS_ACCESS_EXPIRE_MINUTES:30}
    refresh-expire-days: ${PMS_REFRESH_EXPIRE_DAYS:30}
    max-failed-logins: ${PMS_MAX_FAILED_LOGINS:5}
    lock-minutes: ${PMS_LOCK_MINUTES:15}
    # Development fallback returns a copyable URL. Set false in production and
    # provide a PasswordResetNotifier bean (mail/Feishu/WeCom integration).
    password-reset-expose-token: ${PMS_PASSWORD_RESET_EXPOSE_TOKEN:false}
    invitation-expose-token: ${PMS_INVITATION_EXPOSE_TOKEN:false}
  notification:
    startup-check-enabled: ${PMS_NOTIFICATION_STARTUP_CHECK:true}
    mail:
      enabled: ${PMS_MAIL_ENABLED:false}
      base-url: ${PMS_PUBLIC_BASE_URL:http://localhost:57979}
      from: ${PMS_MAIL_FROM:}
  security:
    rate-limit:
      capacity: ${PMS_RATE_LIMIT_CAPACITY:10}
      window-seconds: ${PMS_RATE_LIMIT_WINDOW_SECONDS:60}
    cors:
      allowed-origins: ${PMS_CORS_ALLOWED_ORIGINS:http://localhost:57979,http://127.0.0.1:57979}
