contractId: pms-project-assistant/project-kickoff
agentId: project_assistant
contractKey: project-kickoff
workflowNodeKeys:
  - kickoff
contractVersion: 1.3.0
required: true
locale: zh-CN
principalRole: PMS 项目助手独立履行项目经理职责
specializedAgents: []
readCapabilities:
  - 查询当前项目、节点、成员和任务（以当前已发布工具返回字段为准）
  - 按姓名或邮箱查询可选人员目录，用于把“项目经理、成员、关注人”解析成账号
readToolBindings:
  project-list: pms_project_list
  project-context: pms_project_get
  task-context: pms_task_list
  people-directory: pms_people_list
  bounded-query: pms_query
writeCommands:
  - project.create
  - project.update
  - member.add
  - member.remove
  - follower.add
  - follower.remove
  - node.owner.update
  - node.schedule.update
  - task.create
  - task.assign
  - task.update
  - node.complete
  - node.field.update
  - batch.write
  # 软删除项目：从常规列表隐藏，恢复需走 PMS 管理流程。
  - project.delete
confirmationPolicies:
  project.create: preview-then-execute
  project.update: preview-then-execute
  member.add: preview-then-execute
  member.remove: preview-then-execute
  follower.add: preview-then-execute
  follower.remove: preview-then-execute
  node.owner.update: preview-then-execute
  node.schedule.update: preview-then-execute
  task.create: preview-then-execute
  task.assign: preview-then-execute
  task.update: preview-then-execute
  node.complete: preview-then-execute
  node.field.update: preview-then-execute
  batch.write: preview-then-execute
  project.delete: preview-then-execute
entryConditions:
  - 当前节点为项目立项与启动（kickoff）
  - 用户已登录且当前 PMS 用户具备对应项目权限
  - PMS 项目创建、节点初始化和任务写入能力可用
inputs:
  - 项目名称、目标、范围、成功标准
  - 项目经理、项目成员、关注人和组织单元
  - 项目优先级、项目等级、开始日期和截止日期
  - 当前节点、节点负责人、节点排期和启动任务
  - 节点自定义字段（如页面已配置）
  - 批量操作（例如一次性创建多个任务或添加多个成员）的子操作清单
missingInputRules:
  - 只使用用户明确提供的信息和 PMS 返回的事实
  - 不猜测用户身份、组织、权限、负责人和关键日期
  - 用户没有给出的关键字段先询问，不为这一项生成写入
  - 飞书妙记文字稿里已经说定的内容视为用户明确提供；一名多人、对不上节点或前后矛盾的项留下来问，其余项照常写入
  - 工作流有明确默认值时必须在预览中展示默认值
executionSteps:
  - 先读取项目、工作流节点、成员和任务状态
  - 用户给出飞书妙记文字稿时，从中抽出已经定下来的项目、项目经理、关注人、节点时间、节点负责人和任务；商量中、被否掉或随口提到的不写；文字稿里声称节点已完成时也不调用 node.complete
  - 用 pms_people_list 和当前项目节点把姓名、节点说法对上账号和节点；对不上的项不写入
  - 识别仍缺失的信息并向用户补充询问
  - 汇总项目字段、成员、负责人、排期和任务变更
  - 可写入项超过 20 条时拆成连续多批 batch.write，每批最多 20 条；任一批失败则该批回滚并停止后续批次
  - 对批量变更统一生成一份预览并直接执行，无需等待用户逐次确认
  - 使用原操作编号和幂等键执行，不重复执行未知结果的操作
  - 核验 PMS 返回结果，成功后统一刷新一次当前 PMS 页面
  - 汇报结果并生成下一节点预览，不自动推进节点
completionCriteria:
  - 项目必填字段完整且已保存
  - 项目经理、成员、节点负责人和排期符合当前权限与流程要求
  - 启动任务已按用户要求创建、分配并保存
  - 批量请求已作为一次操作完成并可核验
  - 节点交付物、检查项和摘要已填写
  - PMS 当前节点状态已核验
failureStrategies:
  - 鉴权失败立即停止写入并提示重新建立 PMS 登录态
  - 参数校验失败时指出字段并回到补充信息
  - 系统繁忙或超时时先按幂等键查询状态，不盲目重试
  - 短暂网络失败最多使用同一幂等键重试三次
  - 执行结果未知时标记待核验，禁止重新创建同一业务对象
terminationConditions:
  - 用户明确取消或暂不执行
  - 关键输入缺失且用户无法补充
  - 当前用户无权限或 PMS 能力不可用
  - 连续三轮无法完成或发生数据冲突
  - 写入结果无法核验
