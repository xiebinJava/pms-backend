openapi: 3.0.3
info:
  title: PMS 项目管理 API
  version: 1.0.0
  description: 单企业私有化部署的项目、组织和权限管理接口。
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api
tags:
  - name: 认证
  - name: 项目
  - name: 任务与节点
  - name: 组织与权限
  - name: 导入与审计
  - name: 健康检查
paths:
  /auth/login:
    post:
      tags: [认证]
      security: []
      summary: 邮箱登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [认证]
      security: []
      summary: 刷新访问令牌
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [认证]
      summary: 退出并撤销当前刷新会话
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/change:
    post:
      tags: [认证]
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [认证]
      summary: 当前用户
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/activate:
    post:
      tags: [认证]
      security: []
      summary: 使用邀请令牌激活账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /auth/password-reset/request:
    post:
      tags: [认证]
      security: []
      summary: 申请密码重置
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-reset/confirm:
    post:
      tags: [认证]
      security: []
      summary: 确认密码重置
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /users/search:
    get:
      tags: [组织与权限]
      summary: 按姓名或邮箱搜索用户
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects/page:
    post:
      tags: [项目]
      summary: 项目分页查询
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string }
                status: { type: integer }
                currPage: { type: integer, minimum: 1, default: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    post:
      tags: [项目]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [项目]
      summary: 项目详情
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [项目]
      summary: 更新项目
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [项目]
      summary: 删除项目
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/stats:
    get:
      tags: [项目]
      summary: 项目统计
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects/{id}/terminate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [项目]
      summary: 终止项目
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [项目]
      summary: 恢复已终止项目
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [任务与节点]
      summary: 项目任务列表
      parameters:
        - name: nodeId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [任务与节点]
      summary: 新建任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [任务与节点]
      summary: 更新任务
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [任务与节点]
      summary: 删除任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [任务与节点]
      summary: 拖拽变更任务状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/nodes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [任务与节点]
      summary: 项目节点列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/nodes/{nodeId}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [任务与节点]
      summary: 完成节点
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/rollback:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [任务与节点]
      summary: 回滚节点
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/owner:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    put:
      tags: [任务与节点]
      summary: 设置节点负责人
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/nodes/{nodeId}/schedule:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    put:
      tags: [任务与节点]
      summary: 更新节点排期
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/milestones:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [任务与节点]
      summary: 里程碑列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [任务与节点]
      summary: 新建里程碑
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/milestones/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Id'
    put:
      tags: [任务与节点]
      summary: 更新里程碑
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [任务与节点]
      summary: 删除里程碑
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [项目]
      summary: 项目成员列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [项目]
      summary: 添加项目成员
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: memberId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [项目]
      summary: 移除项目成员
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/followers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [项目]
      summary: 项目关注人列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [项目]
      summary: 项目动态列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [项目]
      summary: 发布项目动态
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /comments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [项目]
      summary: 删除动态
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/images:
    post:
      tags: [项目]
      summary: 上传项目图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /projects/images/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [项目]
      summary: 读取项目图片
      responses:
        '200': { description: 图片二进制 }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/org/tree:
    get:
      tags: [组织与权限]
      summary: 查询组织树
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /org/tree:
    get:
      tags: [组织与权限]
      summary: 查询项目可用组织树
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/org:
    post:
      tags: [组织与权限]
      summary: 新增组织单元
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /admin/org/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [组织与权限]
      summary: 更新组织单元
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [组织与权限]
      summary: 停用组织单元
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /admin/org/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [组织与权限]
      summary: 移动组织节点
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/users:
    get:
      tags: [组织与权限]
      summary: 查询人员
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/invite:
    post:
      tags: [组织与权限]
      summary: 邀请员工
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /admin/users/page:
    get:
      tags: [组织与权限]
      summary: 人员分页
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{id}/primary-position:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [组织与权限]
      summary: 设置主归属
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/users/{id}/part-time-positions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [组织与权限]
      summary: 添加兼职归属
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/users/{id}/part-time-positions/{positionId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: positionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [组织与权限]
      summary: 移除兼职归属
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/users/{id}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: roleId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [组织与权限]
      summary: 授予角色
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [组织与权限]
      summary: 撤销角色
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/users/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [组织与权限]
      summary: 停用账号并撤销会话
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/roles:
    get:
      tags: [组织与权限]
      summary: 查询角色
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [组织与权限]
      summary: 创建角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [组织与权限]
      summary: 更新角色
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [组织与权限]
      summary: 删除角色
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /admin/import/preview/organizations:
    post:
      tags: [导入与审计]
      summary: 预览组织 Excel/CSV 导入
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /admin/import/preview/users:
    post:
      tags: [导入与审计]
      summary: 预览员工 Excel/CSV 导入
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /admin/import/{jobId}/commit:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [导入与审计]
      summary: 提交导入任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/import/template/organizations.csv:
    get:
      tags: [导入与审计]
      summary: 下载组织导入模板
      responses:
        '200': { description: CSV 模板 }
  /admin/import/template/users.csv:
    get:
      tags: [导入与审计]
      summary: 下载员工导入模板
      responses:
        '200': { description: CSV 模板 }
  /admin/audit:
    get:
      tags: [导入与审计]
      summary: 分页查询审计日志
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health:
    get:
      tags: [健康检查]
      security: []
      summary: 就绪探针
      responses:
        '200': { description: 数据库和迁移就绪 }
        '503': { description: 服务未就绪 }
  /healthz:
    get:
      tags: [健康检查]
      security: []
      summary: 就绪探针别名
      responses:
        '200': { description: 数据库和迁移就绪 }
        '503': { description: 服务未就绪 }
  /health/ready:
    get:
      tags: [健康检查]
      security: []
      summary: 就绪探针
      responses:
        '200': { description: 数据库和迁移就绪 }
        '503': { description: 服务未就绪 }
  /health/live:
    get:
      tags: [健康检查]
      security: []
      summary: 存活探针
      responses:
        '200': { description: 进程存活 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, description: 登录邮箱，不区分大小写 }
        username: { type: string, deprecated: true, description: 兼容旧客户端的英文名，不区分大小写 }
        password: { type: string, format: password }
    ApiResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string }
        data: {}
        requestId: { type: string }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [code, msg, requestId]
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Unauthorized:
      description: 未认证或会话已失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 无权访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 数据冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessError:
      description: 业务校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: 请求过于频繁
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
security:
  - bearerAuth: []
