openapi: 3.0.3
info:
  title: PMS 项目管理 API
  version: 1.0.0
  description: 单企业私有化部署的项目、组织和权限管理接口。
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api
tags:
  - name: 认证
  - name: 项目
  - name: 任务与节点
  - name: 组织与权限
  - name: 导入与审计
  - name: 反馈
  - name: 健康检查
paths:
  /auth/providers:
    get:
      tags: [认证]
      security: []
      summary: 当前部署启用的登录方式
      responses:
        '200':
          description: 登录方式列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/oidc/start:
    get:
      tags: [认证]
      security: []
      summary: 开始 OIDC 授权码登录
      responses:
        '200':
          description: 返回授权地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/BusinessError'
  /auth/oidc/callback:
    post:
      tags: [认证]
      security: []
      summary: 用 OIDC 授权码换取本系统会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/ldap/login:
    post:
      tags: [认证]
      security: []
      summary: 目录账号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BusinessError'
  /auth/login:
    post:
      tags: [认证]
      security: []
      summary: 邮箱登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [认证]
      security: []
      summary: 刷新访问令牌
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [认证]
      summary: 退出并撤销当前刷新会话
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/change:
    post:
      tags: [认证]
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [认证]
      summary: 当前用户
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/activate:
    post:
      tags: [认证]
      security: []
      summary: 使用邀请令牌激活账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /auth/password-reset/request:
    post:
      tags: [认证]
      security: []
      summary: 申请密码重置
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-reset/confirm:
    post:
      tags: [认证]
      security: []
      summary: 确认密码重置
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /users/search:
    get:
      tags: [组织与权限]
      summary: 按姓名或邮箱搜索用户
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workbench:
    get:
      tags: [项目]
      summary: 当前用户工作台聚合（我的任务、参与项目、最近动态）
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications:
    get:
      tags: [项目]
      summary: 当前用户站内通知
      parameters:
        - name: unreadFirst
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/page:
    get:
      tags: [项目]
      summary: 分页查询当前用户可见的站内通知
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [TASK_DUE_SOON, TASK_OVERDUE] }
          description: 仅支持临期或逾期提醒类型；省略表示全部类型
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: currPage
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BusinessError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/unread-count:
    get:
      tags: [项目]
      summary: 未读通知数量
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    post:
      tags: [项目]
      summary: 将一条通知标为已读
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read-all:
    post:
      tags: [项目]
      summary: 将全部通知标为已读
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /search:
    get:
      tags: [项目]
      summary: 在可读范围内搜索项目、任务和评论
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/page:
    post:
      tags: [项目]
      summary: 项目分页查询
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string }
                status: { type: integer }
                view: { type: string, enum: [MINE, PORTFOLIO, ALL] }
                orgUnitId: { type: integer, format: int64 }
                projectManagerId: { type: integer, format: int64 }
                projectLevel: { type: integer, enum: [0, 1, 2, 3] }
                attention: { type: string, enum: [ACTIVE, OVERDUE, NO_MANAGER, STALE_NODE] }
                currentNodeKey: { type: string }
                currPage: { type: integer, minimum: 1, default: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    post:
      tags: [项目]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                priority: { type: integer, minimum: 0, maximum: 3, description: 低、中、高、紧急 }
                projectLevel: { type: integer, enum: [0, 1, 2, 3], default: 0, description: 0常规(C)、1重要(B)、2关键(A)、3战略(S) }
                orgUnitId: { type: integer, format: int64 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [项目]
      summary: 项目详情
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [项目]
      summary: 更新项目
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                priority: { type: integer, minimum: 0, maximum: 3, description: 低、中、高、紧急 }
                projectLevel: { type: integer, enum: [0, 1, 2, 3], description: 0常规(C)、1重要(B)、2关键(A)、3战略(S) }
                orgUnitId: { type: integer, format: int64 }
                projectManagerId: { type: integer, format: int64, nullable: true }
                memberIds: { type: array, items: { type: integer, format: int64 } }
                expectedMemberIds: { type: array, items: { type: integer, format: int64 }, description: 客户端上次看到的成员集合，用于避免覆盖并发自动加入的成员 }
                followerIds: { type: array, items: { type: integer, format: int64 } }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [项目]
      summary: 删除项目
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/stats:
    get:
      tags: [项目]
      summary: 项目统计
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects/summary:
    post:
      tags: [项目]
      summary: 项目列表摘要
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string }
                status: { type: integer }
                view: { type: string, enum: [MINE, PORTFOLIO, ALL] }
                orgUnitId: { type: integer, format: int64 }
                projectManagerId: { type: integer, format: int64 }
                projectLevel: { type: integer, enum: [0, 1, 2, 3] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects/{id}/terminate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [项目]
      summary: 终止项目
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [项目]
      summary: 恢复已终止项目
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [任务与节点]
      summary: 项目任务列表
      parameters:
        - name: nodeId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [任务与节点]
      summary: 新建任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requirementId: { type: integer, format: int64, nullable: true, description: 关联当前需求澄清节点且已确认的需求编号 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [任务与节点]
      summary: 任务详情（含子任务、任务评论和附件）
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [任务与节点]
      summary: 更新任务
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requirementId: { type: integer, format: int64, nullable: true, description: 替换为当前节点下已确认的需求 }
                clearRequirement: { type: boolean, description: 清除当前任务的需求关联 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [任务与节点]
      summary: 删除任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [任务与节点]
      summary: 上传任务附件（图片或 PDF）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: attachmentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [任务与节点]
      summary: 下载任务附件
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [任务与节点]
      summary: 删除任务附件
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [任务与节点]
      summary: 拖拽变更任务状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/nodes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [任务与节点]
      summary: 项目节点列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/nodes/{nodeId}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [任务与节点]
      summary: 完成节点
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/rollback:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [任务与节点]
      summary: 回滚节点
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/owner:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    put:
      tags: [任务与节点]
      summary: 设置节点负责人
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/nodes/{nodeId}/schedule:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    put:
      tags: [任务与节点]
      summary: 更新节点排期
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /projects/{projectId}/nodes/{nodeId}/requirements-scope:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [任务与节点]
      summary: 获取需求澄清范围基线
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [任务与节点]
      summary: 保存需求澄清范围基线草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeRequirementScopeUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BusinessError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/requirements-scope/confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [任务与节点]
      summary: 确认需求澄清范围基线
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BusinessError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/solution-design:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [任务与节点]
      summary: 获取方案设计评审决策工作台
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [任务与节点]
      summary: 保存方案包草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeSolutionPackageUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BusinessError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/solution-design/submit:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [任务与节点]
      summary: 提交方案包
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 0, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BusinessError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/solution-design/reviews/{reviewType}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
      - name: reviewType
        in: path
        required: true
        schema: { type: string, enum: [BUSINESS_PRODUCT, TECHNICAL, TEST_RELEASE] }
    post:
      tags: [任务与节点]
      summary: 完成一类方案评审
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeSolutionReviewCompleteRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BusinessError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/nodes/{nodeId}/solution-design/reviews/{reviewType}/reviewer:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NodeId'
      - name: reviewType
        in: path
        required: true
        schema: { type: string, enum: [BUSINESS_PRODUCT, TECHNICAL, TEST_RELEASE] }
    put:
      tags: [任务与节点]
      summary: 设置方案评审人
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeSolutionReviewerUpdateRequest' }
      responses:
