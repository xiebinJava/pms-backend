      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /admin/import/{jobId}/commit:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [导入与审计]
      summary: 提交导入任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/import/{jobId}/errors.csv:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [导入与审计]
      summary: 下载导入错误报告
      responses:
        '200': { description: CSV 错误报告 }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/import/template/organizations.csv:
    get:
      tags: [导入与审计]
      summary: 下载组织导入模板
      responses:
        '200': { description: CSV 模板 }
  /admin/import/template/users.csv:
    get:
      tags: [导入与审计]
      summary: 下载员工导入模板
      responses:
        '200': { description: CSV 模板 }
  /admin/audit:
    get:
      tags: [导入与审计]
      summary: 分页查询审计日志
      parameters:
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: resourceType, in: query, required: false, schema: { type: string } }
        - { name: resourceId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: operatorId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: projectId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: result, in: query, required: false, schema: { type: string, enum: [SUCCESS, FAILURE] } }
        - { name: requestId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time, description: 半开区间结束时间，不包含该时刻 } }
        - { name: currPage, in: query, required: false, schema: { type: integer, format: int64, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [导入与审计]
      summary: 查看审计日志详情
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health:
    get:
      tags: [健康检查]
      security: []
      summary: 就绪探针
      responses:
        '200': { description: 数据库和迁移就绪 }
        '503': { description: 服务未就绪 }
  /healthz:
    get:
      tags: [健康检查]
      security: []
      summary: 就绪探针别名
      responses:
        '200': { description: 数据库和迁移就绪 }
        '503': { description: 服务未就绪 }
  /health/ready:
    get:
      tags: [健康检查]
      security: []
      summary: 就绪探针
      responses:
        '200': { description: 数据库和迁移就绪 }
        '503': { description: 服务未就绪 }
  /health/live:
    get:
      tags: [健康检查]
      security: []
      summary: 存活探针
      responses:
        '200': { description: 进程存活 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, description: 登录邮箱，不区分大小写 }
        username: { type: string, deprecated: true, description: 兼容旧客户端的英文名，不区分大小写 }
        password: { type: string, format: password }
    FeedbackCreateRequest:
      type: object
      required: [title, content, feedbackType]
      properties:
        title: { type: string, maxLength: 160 }
        content: { type: string, maxLength: 5000 }
        feedbackType: { type: string, description: QUESTION、BUG、FEATURE、UX、DATA、PERMISSION 或 OTHER }
        priority: { type: string, description: LOW、NORMAL、HIGH 或 URGENT }
        projectId: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        contextModule: { type: string, maxLength: 80 }
        sourceUrl: { type: string, maxLength: 1000 }
        clientRequestId: { type: string, maxLength: 80, description: 与提交人组合的幂等请求号 }
    FeedbackUpdateRequest:
      type: object
      required: [version]
      properties:
        status: { type: string }
        priority: { type: string }
        assigneeId: { type: integer, format: int64, nullable: true }
        resolutionNote: { type: string, maxLength: 2000 }
        version: { type: integer, minimum: 0 }
    FeedbackReopenRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 2000 }
    NodeRequirementScopeUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的基线版本；版本冲突返回 409 }
        scopeItems: { type: array, description: 纳入/不纳入范围项 }
        requirements: { type: array, description: 需求清单；新增或修改的条目需重新确认；每条需求返回 taskCount 和 completedTaskCount }
    NodeRequirementScopeResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0, nullable: true }
        baselineStatus: { type: integer, description: 0 草稿，1 已确认 }
        confirmedBy: { type: integer, format: int64, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        canEdit: { type: boolean }
        scopeItems: { type: array }
        requirements: { type: array }
    NodeSolutionPackageUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的方案包版本；版本冲突返回 409 }
        productSolution: { type: string, maxLength: 4000 }
        technicalSolution: { type: string, maxLength: 4000 }
    NodeSolutionReviewerUpdateRequest:
      type: object
      required: [reviewerId]
      properties:
        reviewerId: { type: integer, format: int64, description: 项目成员用户 ID }
    NodeSolutionReviewUpdateRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 2000, nullable: true, description: 可选评审建议 }
    NodeSolutionReviewCompleteRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }
    NodeSolutionDecisionConfirmRequest:
      type: object
      required: [result]
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的决策版本；版本冲突返回 409 }
        result: { type: string, enum: [PASS, CONDITIONAL_PASS, RETURN_FOR_CHANGES] }
        conditions: { type: string, maxLength: 2000, description: 有条件通过时必填 }
    NodeSolutionDecisionUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的决策版本；版本冲突返回 409 }
        result: { type: string, enum: [PASS, CONDITIONAL_PASS, RETURN_FOR_CHANGES], nullable: true }
        conditions: { type: string, maxLength: 2000, description: 有条件通过时填写；草稿阶段可为空 }
    NodeSolutionDesignResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        upstreamBaseline: { type: object, description: 需求范围基线只读摘要 }
        solutionPackage: { type: object, description: 单个方案包 }
        reviews: { type: array, description: 固定三类必要评审 }
        decision: { type: object, description: 方案决策及锁定状态 }
    NodeAcceptanceUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的验收版本；版本冲突返回 409 }
        result: { type: string, enum: [PENDING, PASS, CONDITIONAL_PASS] }
        residualItems: { type: string, maxLength: 2000 }
        items: { type: array, description: 来自已确认需求的验收项结果和验证摘要 }
    NodeAcceptanceResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0, nullable: true }
        status: { type: integer, description: 0 草稿，1 已确认 }
        sourceBaselineVersion: { type: integer, minimum: 0, nullable: true, description: 当前验收所对应的需求范围基线版本 }
        sourceBaselineChanged: { type: boolean, description: 需求范围基线变更后当前验收需要重新编辑并保存 }
        result: { type: string, enum: [PENDING, PASS, CONDITIONAL_PASS] }
        residualItems: { type: string, nullable: true }
        confirmedBy: { type: integer, format: int64, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        canEdit: { type: boolean }
        items: { type: array }
        defects: { type: array, description: 只读的关联缺陷摘要 }
    NodeDevelopmentControlUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的开发控制版本；版本冲突返回 409 }
        currentIteration: { type: string, maxLength: 120 }
        topics:
          type: array
          description: 专题及其故事树；选择专题或故事负责人后会自动加入项目成员
          items: { $ref: '#/components/schemas/NodeDevelopmentTopic' }
    NodeDevelopmentControlResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0, nullable: true }
        currentIteration: { type: string, nullable: true }
        canEdit: { type: boolean }
        summary: { type: object, description: 从故事状态和进度派生的项目汇总 }
        topics:
          type: array
          description: 专题和故事树
          items: { $ref: '#/components/schemas/NodeDevelopmentTopic' }
    NodeDevelopmentTopic:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        ownerId: { type: integer, format: int64, nullable: true }
        ownerName: { type: string, nullable: true }
        latestBuildVersion: { type: string, nullable: true }
        testStatus: { type: string }
        status: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        blocker: { type: string, nullable: true }
        sort: { type: integer }
        stories:
          type: array
          items: { $ref: '#/components/schemas/NodeDevelopmentStory' }
    NodeDevelopmentStory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        ownerId: { type: integer, format: int64, nullable: true }
        ownerName: { type: string, nullable: true }
        iterationPlanId: { type: integer, format: int64, nullable: true, description: 所属迭代计划；可为空 }
        iterationPlanName: { type: string, nullable: true }
        status: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        storyPoints: { type: integer, minimum: 0, maximum: 1000 }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        blocker: { type: string, nullable: true }
        sort: { type: integer }
    NodeIterationPlan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 200 }
        ownerId: { type: integer, format: int64, nullable: true }
        ownerName: { type: string, nullable: true }
        goal: { type: string, nullable: true, maxLength: 500 }
        status: { type: string, enum: [PLANNED, IN_PROGRESS, DONE] }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        sort: { type: integer }
    NodeIterationPlanInput:
      allOf:
        - $ref: '#/components/schemas/NodeIterationPlan'
    NodePlanResourceRiskUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的基线版本 }
        iterationPlans:
          type: array
          items: { $ref: '#/components/schemas/NodeIterationPlanInput' }
        resources: { type: array }
        risks: { type: array }
    NodePlanResourceRiskResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0, nullable: true }
        baselineStatus: { type: integer, description: 0 草稿，1 已确认 }
        sourceDecisionChanged: { type: boolean }
        canEdit: { type: boolean }
        iterationPlans:
          type: array
          items: { $ref: '#/components/schemas/NodeIterationPlan' }
        resources: { type: array }
        risks: { type: array }
    NodeReleaseUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的发布交接版本；版本冲突返回 409 }
        releaseVersion: { type: string, maxLength: 120 }
        releaseWindowStart: { type: string, format: date-time, nullable: true }
        releaseWindowEnd: { type: string, format: date-time, nullable: true }
        releaseType: { type: string, enum: [FULL, GRAY, HOTFIX] }
        packageReady: { type: boolean }
        configConfirmed: { type: boolean }
        rollbackReady: { type: boolean }
        monitoringConfirmed: { type: boolean }
        onCallConfirmed: { type: boolean }
        decisionResult: { type: string, enum: [PENDING, APPROVED, DEFERRED, CANCELLED] }
        decisionNote: { type: string, maxLength: 2000 }
        handoverNotes: { type: string, maxLength: 2000 }
        observationItems: { type: string, maxLength: 2000 }
        emergencyContact: { type: string, maxLength: 500 }
    NodeReleaseResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0, nullable: true }
        releaseVersion: { type: string, nullable: true }
        releaseWindowStart: { type: string, format: date-time, nullable: true }
        releaseWindowEnd: { type: string, format: date-time, nullable: true }
        releaseType: { type: string, enum: [FULL, GRAY, HOTFIX] }
        packageReady: { type: boolean }
        configConfirmed: { type: boolean }
        rollbackReady: { type: boolean }
        monitoringConfirmed: { type: boolean }
        onCallConfirmed: { type: boolean }
        decisionResult: { type: string, enum: [PENDING, APPROVED, DEFERRED, CANCELLED] }
        decisionNote: { type: string, nullable: true }
        handoverNotes: { type: string, nullable: true }
        observationItems: { type: string, nullable: true }
        emergencyContact: { type: string, nullable: true }
        canEdit: { type: boolean }
    NodeValueReviewUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的价值复盘版本；版本冲突返回 409 }
        resultStatus: { type: string, enum: [PENDING, ACHIEVED, PARTIAL, NOT_ACHIEVED] }
        actualResult: { type: string, maxLength: 4000 }
        retrospectiveConclusion: { type: string, maxLength: 4000 }
        followUpActions: { type: string, maxLength: 2000 }
    NodeKnowledgeStandardUpdateRequest:
      type: object
      properties:
        version: { type: integer, minimum: 0, nullable: true, description: 已读取的知识工作台版本；版本冲突返回 409 }
        assets:
          type: array
          items: { $ref: '#/components/schemas/NodeKnowledgeAsset' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/NodeKnowledgeAction' }
    NodeKnowledgeStandardResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0, nullable: true }
        canEdit: { type: boolean }
        updatedAt: { type: string, format: date-time, nullable: true }
        assets:
          type: array
          items: { $ref: '#/components/schemas/NodeKnowledgeAsset' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/NodeKnowledgeAction' }
    NodeKnowledgeAsset:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string, maxLength: 200 }
        source: { type: string, nullable: true, maxLength: 200 }
        type: { type: string, enum: [TEMPLATE, CHECKLIST, CASE, STANDARD] }
        improvement: { type: string, nullable: true, maxLength: 500 }
        status: { type: string, enum: [UPDATED, REVIEW, RETAINED, PENDING] }
        sort: { type: integer }
    NodeKnowledgeAction:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        title: { type: string, maxLength: 300 }
        note: { type: string, nullable: true, maxLength: 500 }
        ownerId: { type: integer, format: int64, nullable: true }
        ownerName: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, DONE] }
        sort: { type: integer }
    NodeValueReviewResponse:
      type: object
      properties:
        projectId: { type: integer, format: int64 }
        nodeId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0, nullable: true }
        resultStatus: { type: string, enum: [PENDING, ACHIEVED, PARTIAL, NOT_ACHIEVED] }
        actualResult: { type: string, nullable: true }
        retrospectiveConclusion: { type: string, nullable: true }
        followUpActions: { type: string, nullable: true }
        canEdit: { type: boolean }
    ApiResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string }
        data: {}
        requestId: { type: string }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [code, msg, requestId]
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Unauthorized:
      description: 未认证或会话已失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 无权访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 数据冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessError:
      description: 业务校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: 请求过于频繁
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
security:
  - bearerAuth: []
