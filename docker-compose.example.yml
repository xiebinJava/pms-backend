services:
  oceanbase:
    image: oceanbase/oceanbase-ce:4.3.5.1
    environment:
      MODE: mini
      OB_TENANT_PASSWORD: ${OCEANBASE_ROOT_PASSWORD:?set OCEANBASE_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:2881:2881"
    volumes:
      - oceanbase-data:/home/admin/oceanbase/store
    healthcheck:
      test: ["CMD-SHELL", "obclient -h127.0.0.1 -P2881 -uroot@sys -p$${OB_TENANT_PASSWORD} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    networks: [pms-data]

  accounts-init:
    image: mysql:8.4
    depends_on:
      oceanbase:
        condition: service_healthy
    environment:
      OCEANBASE_HOST: oceanbase
      OCEANBASE_PORT: 2881
      OCEANBASE_DATABASE: brad_pms
      OCEANBASE_ROOT_USER: root@sys
      OCEANBASE_ROOT_PASSWORD: ${OCEANBASE_ROOT_PASSWORD:?set OCEANBASE_ROOT_PASSWORD}
      PMS_APP_PASSWORD: ${PMS_APP_PASSWORD:?set PMS_APP_PASSWORD}
      PMS_MIGRATOR_PASSWORD: ${PMS_MIGRATOR_PASSWORD:?set PMS_MIGRATOR_PASSWORD}
      PMS_ROTATE_ACCOUNT_PASSWORDS: ${PMS_ROTATE_ACCOUNT_PASSWORDS:-false}
    volumes:
      - ./docker/oceanbase-accounts-init.sh:/usr/local/bin/oceanbase-accounts-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/oceanbase-accounts-init.sh"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: "0.5"
    networks: [pms-data]

  schema-init:
    image: mysql:8.4
    depends_on:
      accounts-init:
        condition: service_completed_successfully
    environment:
      OCEANBASE_HOST: oceanbase
      OCEANBASE_PORT: 2881
      OCEANBASE_DATABASE: brad_pms
      OCEANBASE_USER: pms_migrator
      OCEANBASE_PASSWORD: ${PMS_MIGRATOR_PASSWORD:?set PMS_MIGRATOR_PASSWORD}
      PMS_MIGRATIONS_DIR: /migrations
    volumes:
      - ./docker/oceanbase-init.sh:/usr/local/bin/oceanbase-init.sh:ro
      - ./scripts/oceanbase-upgrade.sh:/usr/local/bin/oceanbase-upgrade.sh:ro
      - ./scripts/enterprise-preflight.sh:/usr/local/bin/enterprise-preflight.sh:ro
      - ./scripts/verify-enterprise-migration.sh:/usr/local/bin/verify-enterprise-migration.sh:ro
      - ./src/main/resources/db/migration:/migrations:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/oceanbase-init.sh"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: "0.5"
    networks: [pms-data]

  uploads-init:
    image: busybox:1.36.1-musl
    depends_on:
      schema-init:
        condition: service_completed_successfully
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - pms-uploads:/var/lib/pms/uploads
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /var/lib/pms/uploads &&
        chown -R 10001:10001 /var/lib/pms/uploads &&
        chmod 0750 /var/lib/pms/uploads
    restart: "no"
    mem_limit: 128m
    cpus: "0.25"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      schema-init:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: "1.0"
    environment:
      OCEANBASE_HOST: oceanbase
      OCEANBASE_PORT: 2881
      OCEANBASE_DATABASE: brad_pms
      OCEANBASE_USER: pms_app
      OCEANBASE_PASSWORD: ${PMS_APP_PASSWORD:?set PMS_APP_PASSWORD}
      PMS_JWT_SECRET: ${PMS_JWT_SECRET:?set a random PMS_JWT_SECRET of at least 32 bytes}
      # The example stack is for local evaluation. Production deployments must
      # explicitly set PMS_DEPLOYMENT_ENV=production and the secure flags below.
      PMS_DEPLOYMENT_ENV: ${PMS_DEPLOYMENT_ENV:-development}
      PMS_BOOTSTRAP_ADMIN_USERNAME: ${PMS_BOOTSTRAP_ADMIN_USERNAME:?set bootstrap admin English name}
      PMS_BOOTSTRAP_ADMIN_NAME_ZH: ${PMS_BOOTSTRAP_ADMIN_NAME_ZH:?set bootstrap admin Chinese name}
      PMS_BOOTSTRAP_ADMIN_PASSWORD: ${PMS_BOOTSTRAP_ADMIN_PASSWORD:?set bootstrap admin password}
      PMS_CORS_ALLOWED_ORIGINS: ${PMS_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PMS_UPLOAD_DIR: /var/lib/pms/uploads
      PMS_UPLOAD_QUOTA_BYTES: ${PMS_UPLOAD_QUOTA_BYTES:-524288000}
      # The example runs without SMTP. Production must enable the check and configure SMTP.
      PMS_NOTIFICATION_STARTUP_CHECK: ${PMS_NOTIFICATION_STARTUP_CHECK:-false}
      PMS_MAIL_ENABLED: ${PMS_MAIL_ENABLED:-false}
      PMS_MAIL_HOST: ${PMS_MAIL_HOST:-}
      PMS_MAIL_PORT: ${PMS_MAIL_PORT:-587}
      PMS_MAIL_USERNAME: ${PMS_MAIL_USERNAME:-}
      PMS_MAIL_PASSWORD: ${PMS_MAIL_PASSWORD:-}
      PMS_MAIL_FROM: ${PMS_MAIL_FROM:-}
      PMS_PUBLIC_BASE_URL: ${PMS_PUBLIC_BASE_URL:-http://localhost:5173}
      # Tokens are shown in the local example only; disable both in production.
      PMS_PASSWORD_RESET_EXPOSE_TOKEN: ${PMS_PASSWORD_RESET_EXPOSE_TOKEN:-true}
      PMS_INVITATION_EXPOSE_TOKEN: ${PMS_INVITATION_EXPOSE_TOKEN:-true}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pms-uploads:/var/lib/pms/uploads
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-backend.sh"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [pms-data, pms-edge]

  frontend:
    build:
      context: ../pms-front
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=128m
      - /var/run:rw,noexec,nosuid,size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-frontend.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [pms-edge]

volumes:
  oceanbase-data:
  pms-uploads:

networks:
  pms-data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  pms-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
